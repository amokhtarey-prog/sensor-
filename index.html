<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Wire — Global Coding News, Last 24 Hours</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d9e0e6;
--crit:#c4262e;--high:#b45309;--med:#1d6fa5;--rumor:#7a5af8;--focus:#0b6bcb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--panel:#17212c;--ink:#e8eef3;
--mute:#92a3b3;--line:#27333f;--crit:#ff6b6b;--high:#f5a524;--med:#5cb8f0;--rumor:#a99bff;--focus:#7cc0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{padding:28px 20px 12px;max-width:920px;margin:0 auto}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.meta{color:var(--mute);font-size:.88rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px}
.bar>div{max-width:920px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;font:500 .85rem system-ui;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:920px;margin:0 auto;padding:12px 20px 60px}
h2{font-size:1.15rem;margin:28px 0 8px;color:var(--mute)}
article{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:12px 14px;margin:0 0 10px}
article h3{margin:0 0 4px;font-size:1.05rem;line-height:1.3}
.tag{font:700 .72rem system-ui;color:var(--c);margin-right:8px}
article p{margin:0 0 8px}
.foot{display:flex;flex-wrap:wrap;gap:12px;font-size:.84rem;color:var(--mute)}
.foot a{color:var(--focus);font-weight:500}
.CRITICAL{--c:var(--crit)}.HIGH{--c:var(--high)}.MEDIUM{--c:var(--med)}.RUMOR{--c:var(--rumor)}
.note,.empty{color:var(--mute);font-size:.9rem}
button.copy{margin-left:auto;background:none;border:0;color:var(--focus);font:500 .84rem system-ui;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Dev Wire</h1>
  <div class="meta" id="meta">Loading the latest digest…</div>
</header>
<div class="bar"><div>
  <input type="search" id="q" placeholder="Search: CVE, Rust, Kubernetes…" aria-label="Search stories">
  <span id="pri"></span>
  <button class="chip" id="copyAll">Copy digest</button>
</div></div>
<main id="out" aria-live="polite"></main>

<script>
const $ = s => document.querySelector(s);
const PRI = ["CRITICAL","HIGH","MEDIUM","RUMOR"];
let DATA = null, activePri = new Set(PRI);

const safeUrl = u => { try { const x = new URL(u); return x.protocol === "https:" ? x.href : ""; } catch { return ""; } };
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k === "class" ? n.className = v : n.setAttribute(k, v);
  kids.forEach(c => n.append(c));
  return n;
};
const link = (href, text) => { const u = safeUrl(href); return u ? el("a", {href: u, target: "_blank", rel: "noopener noreferrer"}, text) : ""; };
const line = s => `[${s.priority}] ${s.headline} — ${s.summary} (Source: ${s.source}, ${s.date}) ${s.official_url} ${s.confirm_url || ""}`.trim();

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const out = $("#out"); out.replaceChildren();
  const list = DATA.stories.filter(s => activePri.has(s.priority) &&
    (!q || [s.headline, s.summary, s.category, s.source].join(" ").toLowerCase().includes(q)));
  if (!list.length) { out.append(el("p", {class: "empty"}, "No stories match. Clear the search or enable more priority filters.")); return; }
  const groups = {};
  list.forEach(s => (groups[s.category] ||= []).push(s));
  Object.entries(groups).forEach(([cat, items]) => {
    out.append(el("h2", {}, cat));
    items.forEach(s => {
      const copy = el("button", {class: "copy", type: "button"}, "Copy");
      copy.onclick = () => navigator.clipboard.writeText(line(s)).then(() => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); });
      out.append(el("article", {class: s.priority},
        el("h3", {}, el("span", {class: "tag"}, s.priority), s.headline),
        el("p", {}, s.summary),
        el("div", {class: "foot"}, `${s.source}, ${s.date}`, link(s.official_url, "Official"), link(s.confirm_url, "Confirmation"), copy)));
    });
  });
  if (DATA.gaps?.length) out.append(el("h2", {}, "Coverage gaps"), el("p", {class: "note"}, DATA.gaps.join("; ")));
}

fetch("news.json", {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  DATA = d;
  $("#meta").textContent = `Window: ${d.window} · Updated ${d.generated} · ${d.stories.length} stories. ${d.coverage || ""}`;
  PRI.forEach(p => {
    const b = el("button", {class: "chip", type: "button", "aria-pressed": "true"}, p[0] + p.slice(1).toLowerCase());
    b.onclick = () => { activePri.has(p) ? activePri.delete(p) : activePri.add(p); b.setAttribute("aria-pressed", activePri.has(p)); render(); };
    $("#pri").append(b, " ");
  });
  $("#q").addEventListener("input", render);
  $("#copyAll").onclick = () => navigator.clipboard.writeText(DATA.stories.map(line).join("\n"));
  render();
}).catch(() => { $("#meta").textContent = "Could not load news.json. Run generate_news.py first and serve this folder over HTTP."; });
</script>
</body>
</html>
